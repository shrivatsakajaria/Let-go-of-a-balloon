<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ebc9a5">
<title>Streaming world check</title>
<style>
  :root {
    --ink: 10, 14, 28;
    --paper: #f2efe6;
    --haze-top: #ebc9a5;
    --haze-low: #d8bc9e;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(to bottom, var(--haze-top) 0%, var(--haze-low) 62%, var(--haze-low) 100%);
    color: var(--paper);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
    opacity: 0; transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  canvas.on { opacity: 1; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 64px max(16px, env(safe-area-inset-right)) max(14px, calc(env(safe-area-inset-bottom) + 8px)) max(16px, env(safe-area-inset-left));
    background: linear-gradient(to top, rgba(var(--ink), 0.6) 0%, rgba(var(--ink), 0.4) 40%, rgba(var(--ink), 0) 100%);
    pointer-events: none;
  }
  .caption p { margin: 0; }
  .credit { font-size: 11px; color: rgba(242, 239, 230, 0.86); }
  .credit a, .status { pointer-events: auto; }
  .credit a { white-space: nowrap; color: inherit; text-decoration: underline; text-decoration-color: rgba(242, 239, 230, 0.35); text-underline-offset: 2px; }
  a:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; box-shadow: 0 0 0 4px rgb(var(--ink)); border-radius: 2px; }
  .status { margin-top: 4px !important; font-size: 13px; }
  .status[hidden] { display: none; }
  .clean .caption { display: none; }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="A flight over real map data in the Contour style, streamed around a moving camera"></canvas>
<footer class="caption">
  <p class="credit"><a href="https://openfreemap.org">OpenFreeMap</a> <a href="https://www.openmaptiles.org/">© OpenMapTiles</a> <a href="https://www.openstreetmap.org/copyright">Data from OpenStreetMap</a> <a href="https://mapterhorn.com/attribution">© Mapterhorn</a></p>
  <p class="status" id="status" role="status" hidden></p>
</footer>
<script type="module" src="/src/debug/world.ts"></script>
</body>
</html>
