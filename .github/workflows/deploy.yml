name: Deploy

on:
  push:
    branches: ['**'] # branches only: a pushed tag does not deploy
  workflow_dispatch:
  # GitHub starts timer runs late, or skips them, when it is busy (every 5 to 9 hours on some days),
  # so there are two timers half an hour apart. A run with no newer GFS run to add ends in seconds.
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'

# One queue per Pages branch the run publishes to: "main" (the live site: every timer run, and every
# push or manual run on main) or the preview branch. A preview run can never cancel or hold up a
# live one. Within a queue one run goes at a time, and a newer queued run cancels a waiting one
# (never a running one). So a timer run can cancel a waiting push or manual run on main. That timer
# run still deploys main's newest commit: check-new-run.sh deploys whenever the live site's
# /build.json names another commit than the one checked out, even with no newer GFS run.
concurrency:
  group: deploy-${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
    steps:
      # The live site is the Pages branch "main", so the hourly wind refresh must build main's code.
      # A scheduled run starts on the repository's default branch, which is not main until launch,
      # so it checks out main by name once main exists. Before then (and for every push or manual
      # run) the checkout is left as it was: the commit that started the run.
      - name: Pick the code to build
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "schedule" ] && git ls-remote --exit-code --heads "https://github.com/$REPO.git" main > /dev/null; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Scheduled run: building the main branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      # The public address of the site, set once in src/config.ts (SITE_URL). The check scripts read it.
      - name: Read the site address
        run: |
          url=$(./scripts/site-url.sh)
          echo "SITE_URL=$url" >> "$GITHUB_ENV"

      - name: Check for Cloudflare secrets
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare secrets missing::Build and checks will run, but deploy is skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are added. See docs/for-sk/02-github-secrets.md."
            {
              echo "## Deploy skipped"
              echo
              echo "The Cloudflare secrets are not set yet. The build still ran."
              echo "Add \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` (see docs/for-sk/02-github-secrets.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Deploys when a newer GFS run is ready, or when the live site runs another commit than main's.
      - name: Check for a newer GFS run or newer code (scheduled runs only)
        id: newrun
        if: github.event_name == 'schedule' && steps.cf.outputs.has_cf == 'true'
        run: ./scripts/check-new-run.sh | tee -a "$GITHUB_OUTPUT"

      - name: Skip note
        if: github.event_name == 'schedule' && steps.newrun.outputs.new != 'true'
        run: |
          echo "Scheduled run - nothing to do (Cloudflare secrets missing, or no newer GFS run and the live site already runs this commit)." | tee -a "$GITHUB_STEP_SUMMARY"

      # Everything below runs for push and manual runs, or for scheduled runs with a new GFS run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        run: npm ci

      # Python packages go into a venv, never the runner's global site-packages. The same venv serves
      # the tests and the wind pipeline, and is rebuilt on every run (the pip download cache is kept).
      - name: Create Python venv
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt

      # A failing check stops the run before anything is built or deployed. The hourly wind refresh
      # (schedule) skips them: the code did not change since the last push, which already passed.
      - name: Type check
        if: github.event_name != 'schedule'
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        if: github.event_name != 'schedule'
        run: npm test

      - name: Pipeline tests (pytest)
        if: github.event_name != 'schedule'
        run: |
          . .venv/bin/activate
          pytest pipeline/tests -q

      # Vite empties dist/, so the site is built first and the winds are written into it after.
      # Push and manual runs build with `npm run build`, which type-checks everything first, tests
      # included. A timer run only builds the site (`vite build`): a type slip in a test file must
      # never stop the winds being refreshed (it did once, on 13 November).
      # dist/build.json names the commit built, which check-new-run.sh compares with main. (It is the
      # checkout's HEAD, not GITHUB_SHA: a timer run's GITHUB_SHA is the default branch, not main.)
      - name: Build site
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            npx vite build
          else
            npm run build
          fi
          printf '{"sha":"%s"}\n' "$(git rev-parse HEAD)" > dist/build.json

      # The wind store keeps the newest four built runs between workflow runs. The key never
      # matches exactly, so the newest saved store is restored through the prefix.
      - name: Restore wind store
        if: (github.event_name != 'schedule' || steps.newrun.outputs.new == 'true') && hashFiles('pipeline/build_tiles.py') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .winds-store
          key: winds-store-${{ github.run_id }}
          restore-keys: winds-store-

      # Adds the latest GFS run to the store, keeps the newest four, writes dist/winds/.
      # If the download fails it still publishes the cached runs (and exits 0).
      - name: Build wind tiles
        id: winds
        if: (github.event_name != 'schedule' || steps.newrun.outputs.new == 'true') && hashFiles('pipeline/build_tiles.py') != ''
        run: |
          . .venv/bin/activate
          python pipeline/build_tiles.py --run latest --store .winds-store --out dist/winds

      - name: Save wind store
        if: steps.winds.outputs.newest != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .winds-store
          key: winds-store-${{ steps.winds.outputs.newest }}

      # Cloudflare Pages takes at most 20,000 files per deploy. About 9,500 today: ~1,070 for the
      # site and 2,106 per wind run (1,295 climb tiles, their list, 810 cruise tiles), four runs.
      - name: Count the files to deploy
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        run: |
          n=$(find dist -type f | wc -l)
          echo "Files to deploy: $n (Cloudflare Pages allows 20,000)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$n" -ge 20000 ]; then
            echo "::error title=Too many files::$n files; Cloudflare Pages takes at most 20,000."
            exit 1
          elif [ "$n" -ge 15000 ]; then
            echo "::warning title=Many files::$n files; Cloudflare Pages takes at most 20,000."
          fi

      - name: Cross-origin check (does not block)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node scripts/check-cors.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create Pages project (once)
        if: steps.cf.outputs.has_cf == 'true' && (github.event_name != 'schedule' || steps.newrun.outputs.new == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler pages project create let-go-of-a-balloon --production-branch main 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qi "already exists"; then
            exit "$rc"
          fi

      # wrangler.toml binds the anonymous event counter's dataset (spec 16). Analytics must never stop
      # the winds being published: if this deploy fails, the next two steps set wrangler.toml aside
      # and deploy once more without it (the counter then stores nothing, and the site works as ever).
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.has_cf == 'true' && (github.event_name != 'schedule' || steps.newrun.outputs.new == 'true')
        continue-on-error: true
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0' # keep equal to the exact "wrangler" devDependency in package.json
          command: pages deploy dist --project-name let-go-of-a-balloon --branch ${{ env.BRANCH }}

      - name: Set the analytics settings aside after a failed deploy
        if: steps.deploy.outcome == 'failure'
        # Keep wrangler.toml but drop its analytics binding (the last block): with no wrangler.toml at
        # all, Pages keeps the binding stored by the failed attempt and fails again (14 Nov 2026).
        run: |
          if [ -f wrangler.toml ]; then sed -i '/^\[\[analytics_engine_datasets\]\]/,$d' wrangler.toml; fi
          echo "::warning title=Deployed without analytics::The deploy failed with the event counter's binding (wrangler.toml), so it is retried without it. The site works; the event counter stores nothing until this is fixed (is Analytics Engine switched on in the Cloudflare dashboard?)."
          echo "Deploy retried without the analytics binding in wrangler.toml: the event counter stores nothing until this is fixed." >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to Cloudflare Pages without analytics
        id: deploy_plain
        if: steps.deploy.outcome == 'failure'
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0' # keep equal to the exact "wrangler" devDependency in package.json
          command: pages deploy dist --project-name let-go-of-a-balloon --branch ${{ env.BRANCH }}

      - name: Show deployment URL
        if: steps.deploy.outcome == 'success' || steps.deploy_plain.outcome == 'success'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url || steps.deploy_plain.outputs.deployment-url }}
        run: |
          {
            echo "## Deployed"
            echo
            echo "Branch: \`$BRANCH\`"
            echo
            echo "Preview link: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"

      # R59: the site offers a flight only while it has a wind run under 48 h old. Every run that
      # publishes to the live site (every timer run, even one with nothing new to add) checks the
      # newest live run, and fails when it is over 18 h old, so GitHub emails while there is still
      # more than a day to put it right. After a deploy it reads what was just deployed.
      - name: Check the live winds are fresh
        if: steps.cf.outputs.has_cf == 'true' && env.BRANCH == 'main'
        env:
          MANIFEST: ${{ (steps.deploy.outcome == 'success' || steps.deploy_plain.outcome == 'success') && 'dist/winds/manifest.json' || '' }}
        run: ./scripts/check-wind-age.sh
