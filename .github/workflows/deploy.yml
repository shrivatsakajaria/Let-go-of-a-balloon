name: Deploy

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BRANCH: ${{ github.event_name == 'schedule' && 'main' || github.ref_name }}
      # The public address of the site; scripts/check-cors.mjs and scripts/check-new-run.sh read it.
      SITE_URL: https://let-go-of-a-balloon.pages.dev
    steps:
      # The live site is the Pages branch "main", so the hourly wind refresh must build main's code.
      # A scheduled run starts on the repository's default branch, which is not main until launch,
      # so it checks out main by name once main exists. Before then (and for every push or manual
      # run) the checkout is left as it was: the commit that started the run.
      - name: Pick the code to build
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" = "schedule" ] && git ls-remote --exit-code --heads "https://github.com/$REPO.git" main > /dev/null; then
            echo "ref=main" >> "$GITHUB_OUTPUT"
            echo "Scheduled run: building the main branch." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ref=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Check for Cloudflare secrets
        id: cf
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "has_cf=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cf=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Cloudflare secrets missing::Build and checks will run, but deploy is skipped until CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are added. See docs/for-sk/02-github-secrets.md."
            {
              echo "## Deploy skipped"
              echo
              echo "The Cloudflare secrets are not set yet. The build still ran."
              echo "Add \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` (see docs/for-sk/02-github-secrets.md)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for a newer GFS run (scheduled runs only)
        id: newrun
        if: github.event_name == 'schedule' && steps.cf.outputs.has_cf == 'true'
        run: ./scripts/check-new-run.sh | tee -a "$GITHUB_OUTPUT"

      - name: Skip note
        if: github.event_name == 'schedule' && steps.newrun.outputs.new != 'true'
        run: |
          echo "Scheduled run - nothing to do (Cloudflare secrets missing, or no newer GFS run than the deployed one)." | tee -a "$GITHUB_STEP_SUMMARY"

      # Everything below runs for push and manual runs, or for scheduled runs with a new GFS run.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            pipeline/requirements-dev.txt

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        run: npm ci

      # Python packages go into a venv, never the runner's global site-packages. The same venv serves
      # the tests and the wind pipeline, and is rebuilt on every run (the pip download cache is kept).
      - name: Create Python venv
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -r pipeline/requirements.txt -r pipeline/requirements-dev.txt

      # A failing check stops the run before anything is built or deployed. The hourly wind refresh
      # (schedule) skips them: the code did not change since the last push, which already passed.
      - name: Type check
        if: github.event_name != 'schedule'
        run: npx tsc --noEmit

      - name: Unit tests (vitest)
        if: github.event_name != 'schedule'
        run: npm test

      - name: Pipeline tests (pytest)
        if: github.event_name != 'schedule'
        run: |
          . .venv/bin/activate
          pytest pipeline/tests -q

      # Vite empties dist/, so the site is built first and the winds are written into it after.
      - name: Build site
        if: github.event_name != 'schedule' || steps.newrun.outputs.new == 'true'
        run: npm run build

      # The wind store keeps the newest four built runs between workflow runs. The key never
      # matches exactly, so the newest saved store is restored through the prefix.
      - name: Restore wind store
        if: (github.event_name != 'schedule' || steps.newrun.outputs.new == 'true') && hashFiles('pipeline/build_tiles.py') != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .winds-store
          key: winds-store-${{ github.run_id }}
          restore-keys: winds-store-

      # Adds the latest GFS run to the store, keeps the newest four, writes dist/winds/.
      # If the download fails it still publishes the cached runs (and exits 0).
      - name: Build wind tiles
        id: winds
        if: (github.event_name != 'schedule' || steps.newrun.outputs.new == 'true') && hashFiles('pipeline/build_tiles.py') != ''
        run: |
          . .venv/bin/activate
          python pipeline/build_tiles.py --run latest --store .winds-store --out dist/winds

      - name: Save wind store
        if: steps.winds.outputs.newest != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .winds-store
          key: winds-store-${{ steps.winds.outputs.newest }}

      - name: Cross-origin check (does not block)
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: node scripts/check-cors.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create Pages project (once)
        if: steps.cf.outputs.has_cf == 'true' && (github.event_name != 'schedule' || steps.newrun.outputs.new == 'true')
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(npx wrangler pages project create let-go-of-a-balloon --production-branch main 2>&1) && rc=0 || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] && ! echo "$out" | grep -qi "already exists"; then
            exit "$rc"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.cf.outputs.has_cf == 'true' && (github.event_name != 'schedule' || steps.newrun.outputs.new == 'true')
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.161.0' # keep equal to the exact "wrangler" devDependency in package.json
          command: pages deploy dist --project-name let-go-of-a-balloon --branch ${{ env.BRANCH }}

      - name: Show deployment URL
        if: steps.deploy.outcome == 'success'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Deployed"
            echo
            echo "Branch: \`$BRANCH\`"
            echo
            echo "Preview link: $DEPLOY_URL"
          } >> "$GITHUB_STEP_SUMMARY"
