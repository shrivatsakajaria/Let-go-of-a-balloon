name: Keep alive

# GitHub switches off scheduled workflows in public repositories after 60 days
# with no activity. This makes one small commit to main each month.
#
# It pushes straight to main with the workflow's own token (a push made with that token does not
# start Deploy). If main is ever protected by a rule that blocks direct pushes, add GitHub Actions
# to the rule's bypass list, or this job fails (docs/for-sk/03-keep-it-running.md). Before copying
# approved work to main, Claude merges main back into the work branch, which picks these commits up.

on:
  schedule:
    - cron: '41 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check main exists
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${{ github.repository }}.git" main > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No main branch yet. Nothing to do." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, the same as deploy.yml
        if: steps.main.outputs.exists == 'true'
        with:
          ref: main

      - name: Commit keep-alive
        if: steps.main.outputs.exists == 'true'
        run: |
          date -u +%Y-%m-%d > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit --allow-empty -m "chore: monthly keep-alive"
          git push origin HEAD:main
