<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Landmark check</title>
<style>
  :root { --ink: 10, 14, 28; --paper: #f2efe6; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #e8b392;
    color: var(--paper);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 0; margin: 0;
    padding: 48px 16px 12px;
    background: linear-gradient(to top, rgba(var(--ink), 0.55), rgba(var(--ink), 0));
    pointer-events: none;
  }
  .clean .caption { display: none; }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="One landmark model alone on flat ground"></canvas>
<p class="caption" id="caption" role="status"></p>
<script type="module" src="/src/debug/lmview.ts"></script>
</body>
</html>
