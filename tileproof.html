<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ebc9a5">
<title>Albert Square in Contour</title>
<style>
  :root {
    --ink: 10, 14, 28;
    --paper: #f2efe6;
    /* the golden-hour haze the 3D view opens on (lightFor(8 deg)), painted before any script runs */
    --haze-top: #ebc9a5;
    --haze-low: #d8bc9e;
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: linear-gradient(to bottom, var(--haze-top) 0%, var(--haze-low) 62%, var(--haze-low) 100%);
    color: var(--paper);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: rgba(242, 239, 230, 0.85); color: rgb(var(--ink)); }
  canvas {
    position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block;
    opacity: 0; transition: opacity 700ms cubic-bezier(0.16, 1, 0.3, 1);
  }
  canvas.on { opacity: 1; }
  .caption {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 120px max(16px, env(safe-area-inset-right)) max(20px, calc(env(safe-area-inset-bottom) + 12px)) max(16px, env(safe-area-inset-left));
    /* eased ink shading, strongest under the text, no visible edge */
    background: linear-gradient(to top, rgba(var(--ink), 0.74) 0%, rgba(var(--ink), 0.66) 28%, rgba(var(--ink), 0.46) 48%, rgba(var(--ink), 0.22) 68%, rgba(var(--ink), 0.07) 85%, rgba(var(--ink), 0) 100%);
    pointer-events: none;
  }
  .caption p { margin: 0; max-width: 60ch; }
  .place { font-size: 13px; font-weight: 500; text-wrap: balance; }
  .credit { margin-top: 6px !important; font-size: 11px; color: rgba(242, 239, 230, 0.86); }
  .credit a, .status { pointer-events: auto; }
  .credit a { white-space: nowrap; color: inherit; text-decoration: underline; text-decoration-color: rgba(242, 239, 230, 0.35); text-underline-offset: 2px; text-decoration-thickness: 1px; }
  .credit a:hover { text-decoration-color: currentColor; }
  a:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; box-shadow: 0 0 0 4px rgb(var(--ink)); border-radius: 2px; }
  .status { margin-top: 6px !important; font-size: 13px; }
  .status[hidden] { display: none; }
  .clean .caption { display: none; }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="Albert Square in Manchester and the streets around it, drawn as a small 3D model from real map data in low golden-hour sun"></canvas>
<footer class="caption">
  <p class="place">Albert Square, Manchester · real map data, Contour style</p>
  <p class="credit"><a href="https://openfreemap.org">OpenFreeMap</a> <a href="https://www.openmaptiles.org/">© OpenMapTiles</a> <a href="https://www.openstreetmap.org/copyright">Data from OpenStreetMap</a> <a href="https://mapterhorn.com/attribution">© Mapterhorn</a></p>
  <p class="status" id="status" role="status" hidden></p>
</footer>
<script type="module" src="/src/debug/tileproof.ts"></script>
</body>
</html>
